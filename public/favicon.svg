<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0b1e"/>
      <stop offset="100%" stop-color="#05050b"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="bullGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)" stroke="#1e293b" stroke-width="6"/>
  <rect x="24" y="24" width="464" height="464" rx="100" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.35"/>

  <line x1="80" y1="180" x2="432" y2="180" stroke="#ffffff" stroke-opacity="0.05" stroke-dasharray="6 6"/>
  <line x1="80" y1="256" x2="432" y2="256" stroke="#ffffff" stroke-opacity="0.05" stroke-dasharray="6 6"/>
  <line x1="80" y1="332" x2="432" y2="332" stroke="#ffffff" stroke-opacity="0.05" stroke-dasharray="6 6"/>

  <line x1="160" y1="190" x2="160" y2="350" stroke="#10B981" stroke-width="4" stroke-linecap="round"/>
  <rect x="144" y="225" width="32" height="95" rx="6" fill="url(#bullGlow)"/>

  <line x1="235" y1="160" x2="235" y2="320" stroke="#F43F5E" stroke-width="4" stroke-linecap="round"/>
  <rect x="219" y="190" width="32" height="75" rx="6" fill="#F43F5E"/>

  <line x1="310" y1="120" x2="310" y2="300" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/>
  <rect x="294" y="150" width="32" height="125" rx="6" fill="url(#cyanGlow)" filter="url(#glow)"/>

  <path d="M120 310 Q 210 240 270 210 T 390 120" fill="none" stroke="#38BDF8" stroke-width="8" stroke-linecap="round"/>
  <circle cx="390" cy="120" r="10" fill="#38BDF8" filter="url(#glow)"/>

  <text x="256" y="415" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="900" letter-spacing="4">APEX PRO</text>
  <text x="256" y="445" text-anchor="middle" fill="#38BDF8" font-family="monospace" font-size="18" font-weight="700" letter-spacing="2">F&amp;O • MCX TERMINAL</text>
